name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && set -o pipefail && ./gradlew build --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mega-client-jar
          path: build/libs/mega-client-*.jar

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: In-game test (real Minecraft 1.21.11 client)
        id: gametest
        run: ./gradlew runProductionClientGameTest --no-daemon --stacktrace
      - name: Publish test screenshots and logs to the test-results branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          find . -path '*screenshots*' -name '*.png' -exec cp {} /tmp/out/ \; || true
          find . -path '*run*' -name 'latest.log' -exec cp {} /tmp/out/latest.log \; || true
          cp build/libs/mega-client-*.jar /tmp/out/ 2>/dev/null || true; rm -f /tmp/out/*-sources.jar
          find . -path '*crash-reports*' -name '*.txt' -exec cp {} /tmp/out/ \; || true
          echo "commit ${{ github.sha }} - test outcome: ${{ steps.gametest.outcome }}" > /tmp/out/RESULT.txt
          cd /tmp/out && git init -q && git checkout -q -b test-results && git add -A
          git -c user.name="M.E.G.A CI" -c user.email="ci@users.noreply.github.com" commit -qm "Test results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results

      - name: Read version
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ver
        run: echo "v=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Publish release (only when the in-game test passed)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: M.E.G.A Client v${{ steps.ver.outputs.v }}
          body: "Fabric 1.21.11, client-side, needs only Fabric Loader (no Fabric API). Passed the in-game test on CI. Easiest setup: download Install-MEGA.bat and double-click it."
          files: |
            build/libs/mega-client-*.jar
            !build/libs/*-sources.jar
            installer/Install-MEGA.bat
          make_latest: true

  installer-test:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer on a fresh Windows machine
        shell: cmd
        run: |
          mkdir "%APPDATA%\.minecraft"
          echo {"profiles":{"latest-release":{"name":"","type":"latest-release","lastVersionId":"latest-release"}},"settings":{},"version":3}> "%APPDATA%\.minecraft\launcher_profiles.json"
          mkdir "%APPDATA%\.minecraft\mods"
          echo x> "%APPDATA%\.minecraft\mods\other-26.3-mod.jar"
          echo n| installer\Install-MEGA.bat > "%RUNNER_TEMP%\installer.txt" 2>&1
          type "%RUNNER_TEMP%\installer.txt"
      - name: Check everything was set up
        shell: pwsh
        run: |
          $mc = "$env:APPDATA\.minecraft"
          trap {
            $out = (Get-Content "$env:RUNNER_TEMP\installer.txt" -Raw) -replace "`r?`n", ' | '
            Write-Host "::error::$_ -- installer said: $out"
            exit 1
          }
          Get-ChildItem -Recurse $mc | Select-Object FullName
          $p = (Get-Content "$mc\launcher_profiles.json" -Raw | ConvertFrom-Json).profiles
          if (-not $p.'mega-client') { throw 'M.E.G.A profile missing' }
          if (-not $p.'latest-release') { throw 'existing profile was lost' }
          $v = $p.'mega-client'.lastVersionId
          if (-not (Test-Path "$mc\versions\$v\$v.json")) { throw "version json missing for $v" }
          if ($p.'mega-client'.gameDir -ne "$mc\mega-1.21.11") { throw 'gameDir not set' }
          if (-not (Get-ChildItem "$mc\mega-1.21.11\mods\mega-client-*.jar")) { throw 'mod JAR missing' }
          Write-Host "INSTALLER TEST PASSED ($v)"
