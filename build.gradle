plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // The mod itself does NOT use Fabric API (only Fabric Loader). Fabric API is only needed to compile the in-game
    // test classes, which never load for players.
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // In-game test on CI: real client + ONLY the game-test module and what it needs (no full Fabric API), so the test
    // proves M.E.G.A works with just Fabric Loader.
    productionRuntimeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
    productionRuntimeMods fabricApi.module("fabric-resource-loader-v1", project.fabric_version)
}

// Launches the real 1.21.11 client with the built mod, runs MegaClientGameTest, then exits (fails the build on error).
tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    jvmArgs.add("-Dfabric.client.gametest")
    jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
    useXVFB = true
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

// Long "live footage" scenario: random stashes across a 5000-block world, elytra flight, frames for a video.
tasks.register("runProductionClientScenario", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    jvmArgs.add("-Dfabric.client.gametest")
    jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
    jvmArgs.add("-Dmega.scenario=true")
    jvmArgs.add("-Xmx3G")
    useXVFB = true
}

// "Dig to the stash" footage: find a stash ~100 blocks down, dig to it, place a banner.
tasks.register("runProductionClientDig", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    jvmArgs.add("-Dfabric.client.gametest")
    jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
    jvmArgs.add("-Dmega.scenario=dig")
    jvmArgs.add("-Xmx3G")
    useXVFB = true
}

loom {
    accessWidenerPath = file("src/main/resources/mega_client.accesswidener")
}
